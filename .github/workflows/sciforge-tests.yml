# SPDX-License-Identifier: LGPL-2.1-or-later
# SciForge: tests on every push and pull request (about 40 minutes).
# Runs SciForge's unit tests, the golden models and the GUI tests against
# the official FreeCAD release the fork is based on, with SciForge added as an
# add-on, on Linux; the golden models and the Static Stress checks also on FreeCAD for
# Windows. No C++ build, so it stays cheap. Full builds: sciforge-build.yml.

name: SciForge tests
# a repeat run says so in its title (the patch release does not count it as the tests passing)
run-name: ${{ github.event_name == 'workflow_dispatch' && (inputs.repeat != '1' || inputs.paced_by != '' || inputs.stress || inputs.scenarios != '') && format('Repeat GUI scenarios x{0}{1}{2}', inputs.repeat, inputs.stress && ' under stress' || '', inputs.paced_by != '' && format(' paced by {0}', inputs.paced_by) || '') || '' }}

on:
  push:
  pull_request:
  # A manual run can repeat the GUI scenarios to find a race (docs/sciforge/dev/gui-tests.md):
  # each scenario part runs its scenarios `repeat` times and reports how often each passed.
  workflow_dispatch:
    inputs:
      repeat:
        description: "Run each GUI scenario this many times (1: a normal run of everything)"
        default: "1"
      scenarios:
        description: "Only these scenarios, comma separated (empty: all)"
        default: ""
      stress:
        description: "On a slow machine on purpose (FreeCAD pinned to one CPU core with busy loops)"
        type: boolean
        default: false
      paced_by:
        description: "state: try every chosen scenario without its fixed waits (converting them)"
        default: ""

# (a manual repeat run does not cancel the run of a push, which a patch release needs green)
concurrency:
  group: sciforge-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FREECAD_VERSION: "1.1.4"

jobs:
  # The tests run side by side on 10 machines (one machine took about 2 hours): "base" runs
  # the unit tests, golden models, smoke test and journey; "1/9".."9/9" each run a ninth
  # of the GUI scenarios (tools/sciforge/run_tests.sh --shard). Four parts of 481 scenarios
  # took 83-91 minutes (one hit the 90-minute limit, run #258); the merge of experimental
  # (0.1.0-beta.2) made 519, six parts of 560 took over 80 minutes (beta 3: the simulation
  # scenarios solve), so nine parts.
  tests:
    name: tests (${{ matrix.part }})
    runs-on: ubuntu-24.04
    # (a repeat run of a few scenarios fits; GitHub's own limit for a job is 6 hours)
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.repeat != '1' && 360 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: base
            args: --only base
            id: base
          - part: scenarios 1/9
            args: --only scenarios --shard 1/9
            id: scenarios-1
          - part: scenarios 2/9
            args: --only scenarios --shard 2/9
            id: scenarios-2
          - part: scenarios 3/9
            args: --only scenarios --shard 3/9
            id: scenarios-3
          - part: scenarios 4/9
            args: --only scenarios --shard 4/9
            id: scenarios-4
          - part: scenarios 5/9
            args: --only scenarios --shard 5/9
            id: scenarios-5
          - part: scenarios 6/9
            args: --only scenarios --shard 6/9
            id: scenarios-6
          - part: scenarios 7/9
            args: --only scenarios --shard 7/9
            id: scenarios-7
          - part: scenarios 8/9
            args: --only scenarios --shard 8/9
            id: scenarios-8
          - part: scenarios 9/9
            args: --only scenarios --shard 9/9
            id: scenarios-9
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          submodules: false

      # The one GUI environment of CI and local runs (virtual screen, software OpenGL, the
      # DejaVu fonts; numpy for the unit tests of the simulation's results)
      - name: Install the GUI test environment
        run: tools/sciforge/gui_env.sh --install

      - name: Cache FreeCAD ${{ env.FREECAD_VERSION }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .sciforge-cache/freecad
          key: freecad-appimage-${{ env.FREECAD_VERSION }}

      - name: Get FreeCAD ${{ env.FREECAD_VERSION }}
        run: tools/sciforge/get_freecad.sh .sciforge-cache/freecad

      # The full build installs SciForge with src/Mod/SciForge/CMakeLists.txt; a file left out
      # there only shows in a full build, hours later.
      - name: Every SciForge file is installed by the full build
        if: matrix.id == 'base'
        run: tools/sciforge/check_install.sh

      # No new fixed waits in the GUI tests: their number only goes down (tools/sciforge/
      # check_waits.json), until every scenario waits for the app's state
      - name: No new fixed waits in the GUI tests
        if: matrix.id == 'base'
        run: python3 tools/sciforge/check_waits.py

      - name: Tests (${{ matrix.part }})
        env:
          REPEAT: ${{ inputs.repeat || '1' }}
          ONLY_SCENARIOS: ${{ inputs.scenarios || '' }}
          STRESS: ${{ inputs.stress && '--stress' || '' }}
          SCIFORGE_PACED_BY: ${{ inputs.paced_by || '' }}
        run: |
          # (GitHub runs this with bash -e: no command whose failure is an answer, like a
          # test in $(...), may stand alone)
          extra=()
          trial=""
          if [ "${REPEAT}" != 1 ] || [ -n "${ONLY_SCENARIOS}${STRESS}${SCIFORGE_PACED_BY}" ]; then
            trial=1
          fi
          if [ "${{ matrix.id }}" = base ] && [ -n "${trial}" ]; then
            echo "A repeat run is about the GUI scenarios: the base tests are skipped."
            exit 0
          fi
          if [ "${{ matrix.id }}" != base ]; then
            if [ "${REPEAT}" != 1 ]; then extra+=(--repeat "${REPEAT}"); fi
            if [ -n "${ONLY_SCENARIOS}" ]; then extra+=(--scenario "${ONLY_SCENARIOS}"); fi
            if [ -n "${STRESS}" ]; then extra+=("${STRESS}"); fi
          fi
          tools/sciforge/run_tests.sh --freecad .sciforge-cache/freecad --out test-output ${{ matrix.args }} "${extra[@]}"

      - name: Add golden report to the run summary
        if: always() && matrix.id == 'base'
        run: |
          if [ -f test-output/golden-report.md ]; then cat test-output/golden-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sciforge-test-output-${{ matrix.id }}
          path: test-output/
          retention-days: 14

  # The golden models on the official FreeCAD for Windows (Luca's system), SciForge added
  # as an add-on. Catches what only Windows does (2026-10-12: a number too big for
  # Windows' 32-bit C "long" failed every Shell Both; only a 3-hour Windows build saw it).
  windows:
    name: tests (Windows golden models)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.repeat == '1' }}
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          submodules: false

      - name: Cache FreeCAD ${{ env.FREECAD_VERSION }} for Windows
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .sciforge-cache/freecad-windows
          key: freecad-windows-${{ env.FREECAD_VERSION }}

      - name: Golden models on FreeCAD for Windows
        run: bash tools/sciforge/windows_golden.sh --stock .sciforge-cache/freecad-windows test-output

      - name: Add golden report to the run summary
        if: always()
        run: |
          if [ -f test-output/golden-report.md ]; then cat test-output/golden-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sciforge-test-output-windows
          path: test-output/
          retention-days: 14

  # The Static Stress checks (hand calculations: run_tests.sh's "sim") on the official FreeCAD
  # for Windows, meshed by the gmsh.exe and solved by the ccx.exe it ships, as on Luca's PC.
  windows-sim:
    name: tests (Windows simulation)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.repeat == '1' }}
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          submodules: false

      - name: Cache FreeCAD ${{ env.FREECAD_VERSION }} for Windows
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .sciforge-cache/freecad-windows
          key: freecad-windows-${{ env.FREECAD_VERSION }}

      - name: Static Stress on FreeCAD for Windows
        run: bash tools/sciforge/windows_sim.sh --stock .sciforge-cache/freecad-windows test-output

      - name: Add the simulation report to the run summary
        if: always()
        run: |
          for f in test-output/sim-benchmarks.md test-output/sim-accuracy-qa.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sciforge-test-output-windows-sim
          path: test-output/
          retention-days: 14

  # install_update.ps1 -Quiet, what "Update now" starts after SciForge quits, on Windows
  # PowerShell 5.1 against a fake SciForge folder (a dummy SciForge.exe, a Mod\SciForge): it
  # waits, replaces the module, keeps a backup, restarts; a failure puts the old version back.
  # (The same steps also run in the unit tests with pwsh on Linux.)
  update-script:
    name: tests (update script, Windows)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.repeat == '1' }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          submodules: false

      - name: install_update.ps1 -Quiet against a fake SciForge folder
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\sciforge\test_update_script.ps1

  # Packaged at once, without waiting for the tests (Luca 2026-10-19: "I need to be testing
  # asap"); the tests run beside it and report on their own.
  quick-update:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.repeat == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          submodules: false

      # The same script packages a release's quick update (sciforge-build.yml). No core id here:
      # a test run does not know which compiled part the person's SciForge has.
      - name: Package the quick update (SciForge module only, no rebuild needed)
        run: tools/sciforge/make_quick_update.sh --out quick-update

      - name: Upload the quick update
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: SciForge-quick-update-${{ github.sha }}
          path: quick-update/
          retention-days: 30
